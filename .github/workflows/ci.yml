name: Build HORIXON .hmod


on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Install official Horizon mod builder (pinned SDK build)
        run: cargo install --git https://github.com/horizon-rust/horizon.git --rev dd67b76ff23e28c6d8e21859df600d31572f81a0 --locked cargo-horizon-mod
      - name: Check native and wasm API compatibility
        run: cargo horizon-mod check --uses
      - name: Build official .hmod package
        run: cargo horizon-mod build
      - name: Validate flat .hmod archive
        run: python3 tools/validate_hmod.py target/horizon-mod/horixon.hmod
      - name: Official package check
        run: cargo horizon-mod check target/horizon-mod/horixon.hmod
      - uses: actions/upload-artifact@v4
        with:
          name: horixon-hmod
          path: target/horizon-mod/horixon.hmod
          if-no-files-found: error
      - name: Attach .hmod to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/horizon-mod/horixon.hmod
