name: Build HORIXON .hnmod

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Runtime tests
        run: cargo test --workspace --locked
      - name: Build deterministic .hnmod
        run: python3 tools/horizon.py package
      - name: Validate .hnmod contents
        run: python3 tools/validate_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: horixon-hnmod
          path: target/horixon-0.4.0.hnmod
          if-no-files-found: error
      - name: Attach .hnmod to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/horixon-0.4.0.hnmod
