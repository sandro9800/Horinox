name: Native compatibility check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HORIXON
        uses: actions/checkout@v4

      - name: Checkout pinned Horizon source
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ba6344a59cb9e755b730dcf02285fc0d33b97d3c
          path: horizon

      - name: Checkout pinned horizon-mixins
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mixins
          ref: d9c83d7096b7ea5b83678da2efdfd6161f74997e
          path: horizon-mixins

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Cargo builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/horizon-cargo
            horizon-mixins/target
          key: ${{ runner.os }}-horixon-native-1.95-ba6344-d9c83d

      - name: Test HORIXON runtime
        run: cargo test --workspace --locked

      - name: Stage native bundle on Horizon
        run: python3 tools/horizon.py stage --horizon ./horizon --mixins ./horizon-mixins

      - name: Compile patched Horizon client
        run: python3 tools/horizon.py check --horizon ./horizon --mixins ./horizon-mixins

      - name: Run native runtime tests in Horizon
        run: python3 tools/horizon.py test --horizon ./horizon --mixins ./horizon-mixins

      - name: Upload native-check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horixon-native-check-logs
          path: |
            target/horizon-*.log
            target/stage/
          if-no-files-found: ignore
